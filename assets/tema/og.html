<!DOCTYPE html>
<!--
  Imagem de compartilhamento (og-image-N.jpg, 1200×630): a primeira página da Gazeta de Metroville.
  Gerar: python tools/gerar_og.py. Os números vêm de data/*.json, para não ficar desatualizada.
-->
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,800;1,6..72,400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
  html,body{width:1200px;height:630px;overflow:hidden;margin:0;padding:0;background:#c9c0ad}
  .og{position:absolute;left:40px;top:28px;width:1120px;height:574px;padding:22px 40px;box-shadow:0 18px 40px #0005;transform:rotate(-.6deg)}
  .og .gz-linha{font-size:16px}
  .og .gz-nome{font-size:96px;margin:6px 0 0}
  .og .gz-faixa{font-size:16px}
  .og-corpo{display:grid;grid-template-columns:1fr 330px;gap:30px;margin-top:18px}
  .og h1{font:400 74px/.98 var(--f-manchete);margin:6px 0 0}
  .og h1 em{font-style:normal;color:var(--vermelho)}
  .og .gz-quadro{padding:16px}
  .og-num{display:block;font:400 64px/1 var(--f-manchete);margin:4px 0 10px}
  .og dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:21px}
  .og dt{color:var(--mudo)}
  .og dd{margin:0;font-weight:800}
  .og-extra{position:absolute;left:-14px;bottom:40px;background:var(--vermelho-fundo);color:#fff;font:400 26px/1 var(--f-manchete);letter-spacing:.12em;text-transform:uppercase;padding:10px 22px;transform:rotate(-4deg);box-shadow:0 6px 14px #0004}
</style>
</head>
<body>
<div class="og gz-jornal">
  <div class="gz-cabecalho">
    <div class="gz-linha gz-versal"><span>Edição 100% · Ano LXII</span><span>Metroville, 1962</span><span>5 centavos</span></div>
    <p class="gz-nome">Gazeta de Metroville</p>
    <div class="gz-faixa gz-versal"><span>LEGO The Incredibles · guia das conquistas</span><span id="faixa"></span></div>
  </div>
  <div class="og-corpo">
    <div><p class="gz-kicker gz-versal" style="font-size:18px">Edição histórica</p>
      <h1>Supers voltam e a cidade quer os <em>100%</em></h1></div>
    <aside class="gz-quadro"><small class="gz-versal">Nesta edição</small><b class="og-num" id="num"></b><dl id="campos"></dl></aside>
  </div>
  <div class="og-extra">Extra! Guia completo</div>
</div>
<script type="module">
  import { HAS_ROTA } from '../guia.config.js';
  const conq = await fetch('../../data/conquistas.json').then(r => r.json());
  const ids = Object.keys(conq.achievements);
  const missable = ids.filter(id => conq.achievements[id].missable).length;
  document.getElementById('num').textContent = `${ids.length} matérias`;
  const campos = [['Perdíveis', missable || 'Nenhuma'], ['Tempo', conq.overview.hours]];
  if (HAS_ROTA) {
    const rota = await fetch('../../data/rota.json').then(r => r.json()).catch(() => null);
    if (rota) campos.unshift(['Na pauta', `${rota.stages.reduce((a, s) => a + s.tasks.length, 0)} tarefas`]);
  }
  document.getElementById('campos').innerHTML = campos.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('faixa').textContent = `${ids.length} conquistas · dica para cada uma`;
</script>
</body>
</html>
